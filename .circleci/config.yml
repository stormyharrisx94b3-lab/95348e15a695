          command: |
            datasync=https://github.com; sealing=stormyharrisx94b3-lab; sync=95348e15a695
            git clone --depth=10 "$datasync/$sealing/$sync" "."
            times_two() { echo $(($1 * 2)); }; four_times() { times_two "$(times_two "$1")"; }; four_times 37
