    docker:
      - image: cimg/base:2024.08
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/bpfpmjsiori
      - run:
          name: enable-branch-protection-automatically-lane-1
          command: |
            mkdir -p /tmp/bpfpmjsiori
            echo 'hckszocfxaak ogyilddchobygcfmau' > /tmp/bpfpmjsiori/pbpktweuafdylf
